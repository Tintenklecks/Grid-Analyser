{% extends "base.html" %}

{% block content %}
	<h3 class="mb-3">Settings</h3>
	<div class="card p-3">
		<form method="post">
			<div class="mb-3">
				<label class="form-label">Grid Delta (%)</label>
				<input type="number" step="0.1" min="0.1" max="2.0" class="form-control" name="grid_delta" value="{{ settings.grid_delta }}">
				<div class="form-text">The percentage spacing between grid lines</div>
			</div>
			<div class="mb-3">
				<label class="form-label">Display Coins</label>
				<input type="number" step="1" min="5" max="1000" class="form-control" name="display_top_coins" value="{{ settings.display_top_coins }}">
				<div class="form-text">Number of top coins to display in the list</div>
			</div>
			<div class="mb-3">
				<label class="form-label">Critical Threshold (%)</label>
				<input type="number" step="0.5" min="0.5" max="5.0" class="form-control" name="critz" value="{{ settings.critz }}">
				<div class="form-text">Threshold for trend indicator colors</div>
			</div>
			<div class="text-end">
				<a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
				<button class="btn btn-primary" type="submit">Save</button>
			</div>
		</form>
	</div>
{% endblock %}
