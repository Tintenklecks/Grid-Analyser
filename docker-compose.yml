version: '3.8'

services:
  grid-analyzer:
    build: .
    container_name: grid-trading-analyzer
    ports:
      - "4712:8501"
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s 